name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PDFium
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8035/pdfium-linux-x64.tgz"
          mkdir -p "$HOME/pdfium"
          tar -xzf /tmp/pdfium.tgz -C "$HOME/pdfium"
          sudo cp "$HOME/pdfium/lib/libpdfium.so" /usr/local/lib/
          sudo ldconfig
      - name: Install SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2
      - run: cargo build --workspace --release
      - run: cargo test --workspace
        env:
          CI: "true"
          OPENPDF_PDFIUM: /usr/local/lib/libpdfium.so
      - name: Generate Swift and C# bindings
        run: |
          set -euo pipefail
          cargo build -p openpdf-ffi --release
          mkdir -p bindings/swift bindings/csharp
          cargo run -p openpdf-ffi --features bindgen --bin uniffi-bindgen -- \
            generate --library target/release/libopenpdf_ffi.so \
            --language swift --out-dir bindings/swift
          cargo install uniffi-bindgen-cs \
            --git https://github.com/NordSecurity/uniffi-bindgen-cs \
            --tag v0.10.0+v0.29.4
          uniffi-bindgen-cs --library --out-dir bindings/csharp \
            target/release/libopenpdf_ffi.so
          test -n "$(find bindings/swift -type f | head -n 1)"
          test -n "$(find bindings/csharp -type f | head -n 1)"


  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PDFium
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8035/pdfium-mac-arm64.tgz"
          mkdir -p "$HOME/pdfium"
          tar -xzf /tmp/pdfium.tgz -C "$HOME/pdfium"
          if [ -f "$HOME/pdfium/lib/libpdfium.dylib" ]; then
            echo "OPENPDF_PDFIUM=$HOME/pdfium/lib/libpdfium.dylib" >> "$GITHUB_ENV"
          else
            echo "OPENPDF_PDFIUM=$HOME/pdfium/bin/libpdfium.dylib" >> "$GITHUB_ENV"
          fi
      - name: Build openpdf-macos
        run: |
          set -euo pipefail
          chmod +x apps/macos/build.sh
          ./apps/macos/build.sh
      - name: xcodebuild (SwiftPM scheme)
        run: |
          set -euo pipefail
          cd apps/macos
          SCHEME="$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')"
          SCHEME="${SCHEME:-OpenPDF}"
          xcodebuild -scheme "$SCHEME" -destination 'generic/platform=macOS' \
            -derivedDataPath .derived CODE_SIGNING_ALLOWED=NO \
            OTHER_LDFLAGS="-L$(pwd)/lib -lopenpdf_ffi" \
            LD_RUNPATH_SEARCH_PATHS="$(pwd)/lib"
      - name: Measure (headless)
        run: |
          set -euo pipefail
          BIN="$(cd apps/macos && swift build -c release --show-bin-path)/openpdf-macos"
          test -x "$BIN"
          "$BIN" --measure 32
        env:
          OPENPDF_CORPUS: ${{ github.workspace }}/corpus
          OPENPDF_PDFIUM: ${{ env.OPENPDF_PDFIUM }}

