name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PDFium
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8035/pdfium-linux-x64.tgz"
          mkdir -p "$HOME/pdfium"
          tar -xzf /tmp/pdfium.tgz -C "$HOME/pdfium"
          sudo cp "$HOME/pdfium/lib/libpdfium.so" /usr/local/lib/
          sudo ldconfig
      - name: Install SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2
      - run: cargo build --workspace --release
      - run: cargo test --workspace
        env:
          CI: "true"
          OPENPDF_PDFIUM: /usr/local/lib/libpdfium.so
      - name: Generate Swift and C# bindings
        run: |
          set -euo pipefail
          cargo build -p openpdf-ffi --release
          mkdir -p bindings/swift bindings/csharp
          cargo run -p openpdf-ffi --features bindgen --bin uniffi-bindgen -- \
            generate --library target/release/libopenpdf_ffi.so \
            --language swift --out-dir bindings/swift
          cargo install uniffi-bindgen-cs \
            --git https://github.com/NordSecurity/uniffi-bindgen-cs \
            --rev e4f18be96ca812571fd85fc39555646158b06b9c \
            --locked
          uniffi-bindgen-cs --library --out-dir bindings/csharp \
            target/release/libopenpdf_ffi.so
          test -n "$(find bindings/swift -type f | head -n 1)"
          test -n "$(find bindings/csharp -type f | head -n 1)"

