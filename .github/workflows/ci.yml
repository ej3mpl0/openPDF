name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PDFium
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8035/pdfium-linux-x64.tgz"
          mkdir -p "$HOME/pdfium"
          tar -xzf /tmp/pdfium.tgz -C "$HOME/pdfium"
          sudo cp "$HOME/pdfium/lib/libpdfium.so" /usr/local/lib/
          sudo ldconfig
      - name: Install SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 tesseract-ocr
      - run: cargo build --workspace --release
      - run: cargo test --workspace
        env:
          CI: "true"
          OPENPDF_PDFIUM: /usr/local/lib/libpdfium.so
