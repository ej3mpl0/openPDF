name: CI

# Linux runs on every push and PR. Windows and macOS (2x / 10x billed minutes
# on private repos) run only on push to main, or on a non-draft PR labelled
# `ci:full`.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Core/CLI startup budget per OS; GUI limits are set on the Measure GUI step.
        # Override a single OS here without changing the script.
        include: ${{ fromJSON(
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
            contains(github.event.pull_request.labels.*.name, 'ci:full')))
          && '[{"os":"ubuntu-latest","measure_startup_core_ms":300},{"os":"windows-latest","measure_startup_core_ms":300},{"os":"macos-latest","measure_startup_core_ms":300}]'
          || '[{"os":"ubuntu-latest","measure_startup_core_ms":300}]') }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      OPENPDF_MEASURE_RAM_MIB: "250"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ci-${{ matrix.os }}

      - name: Start timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install PDFium
        run: .github/scripts/install-pdfium.sh

      - name: Install SoftHSM2
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2

      - name: Install GTK4 and libadwaita
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev pkg-config

      - name: Build core, CLI, and sign
        run: cargo build --release -p openpdf-core -p openpdf-cli -p openpdf-sign

      - name: Build GTK
        if: runner.os == 'Linux'
        run: cargo build --release -p openpdf-gtk

      - name: Test core and CLI
        run: cargo test --release -p openpdf-core -p openpdf-cli

      - name: Test sign
        run: cargo test --release -p openpdf-sign -- --test-threads=1

      - name: Test GTK
        if: runner.os == 'Linux'
        run: cargo test --release -p openpdf-gtk

      - name: Measure core / CLI
        run: python3 .github/scripts/run-measure.py --kind core
        env:
          OPENPDF_MEASURE_STARTUP_MS: ${{ matrix.measure_startup_core_ms }}

      - name: Measure GUI
        if: runner.os == 'Linux'
        run: python3 .github/scripts/run-measure.py --kind gui --runs 5
        env:
          # Pinned so numbers are comparable; GL under Xvfb is software and
          # adds ~45 MiB / ~70 ms.
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          OPENPDF_MEASURE_STARTUP_MS: "300"
          OPENPDF_MEASURE_RAM_MIB: "160"

      # Informational only: default GSK renderer (GL in software under Xvfb).
      # Never gates; the cairo step above is the gate.
      - name: Measure GUI (informational, default renderer)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          GDK_BACKEND: x11
          OPENPDF_MEASURE_STARTUP_MS: "1000000"
          OPENPDF_MEASURE_RAM_MIB: "100000"
        run: |
          set -o pipefail
          env -u GSK_RENDERER python3 .github/scripts/run-measure.py --kind gui --runs 5 \
            | tee measure-default.log || true
          median=$(grep -E '^measure: median' measure-default.log || echo 'measure: no result')
          echo "$median"
          {
            echo "### GUI measure, default renderer (informational, software rendering under xvfb)"
            echo
            echo "\`$median\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record CI time
        if: always()
        run: |
          set -euo pipefail
          end=$(date +%s)
          start="${JOB_START:-$end}"
          dur=$((end - start))
          mkdir -p ci-times
          printf 'os=%s\nduration_s=%s\n' "${{ matrix.os }}" "$dur" > "ci-times/${{ matrix.os }}.txt"
          {
            echo "## ${{ matrix.os }}"
            echo
            echo "CI time: **${dur}s**"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-time-${{ matrix.os }}
          path: ci-times/${{ matrix.os }}.txt
          if-no-files-found: error

  times:
    name: CI times
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-time-*
          path: ci-times
          merge-multiple: true

      - name: Summarize CI times per OS
        run: |
          set -euo pipefail
          {
            echo "## CI times per OS"
            echo
            echo "| OS | Seconds |"
            echo "| --- | ---: |"
            for f in ci-times/*.txt; do
              [ -f "$f" ] || continue
              os=$(sed -n 's/^os=//p' "$f")
              dur=$(sed -n 's/^duration_s=//p' "$f")
              echo "| \`$os\` | ${dur} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
