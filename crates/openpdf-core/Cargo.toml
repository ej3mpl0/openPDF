[package]
name = "openpdf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PDF document, render, text, and structure core for openPDF"

[features]
default = []
# Locale test lock + helpers for dependents (openpdf-sign, openpdf-cli).
test-support = []

[dependencies]
lopdf = "0.36.0"
pdfium-render = "0.9.4"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
getrandom = "0.3"
zeroize = { version = "1", features = ["alloc"] }
directories = "5"
sys-locale = "0.3"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]

[[bench]]
name = "perf"
harness = false

[[bin]]
name = "openpdf-measure"
path = "src/bin/measure.rs"
