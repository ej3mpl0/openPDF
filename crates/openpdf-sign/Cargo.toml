[package]
name = "openpdf-sign"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PAdES-B-B signing for openPDF (PKCS#11, Windows CNG, macOS Keychain)"

[dependencies]
openpdf-core = { path = "../openpdf-core" }
cms = "0.2"
const-oid = { version = "0.9", features = ["db"] }
cryptoki = "0.12"
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
lopdf = "0.36.0"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
p521 = { version = "0.13", default-features = false, features = ["ecdsa", "getrandom", "pkcs8"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2", "u64_digit"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
zeroize = { version = "1", features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
openpdf-core = { path = "../openpdf-core", features = ["test-support"] }
rand = "0.8"
