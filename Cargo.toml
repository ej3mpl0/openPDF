[workspace]
resolver = "2"
members = [
    "crates/openpdf-core",
    "crates/openpdf-cli",
    "crates/openpdf-gtk",
    "crates/openpdf-sign",
]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
version = "0.1.0"

[workspace.dependencies]
openpdf-core = { path = "crates/openpdf-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
