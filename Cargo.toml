[workspace]
resolver = "2"
members = [
    "crates/openpdf-core",
    "crates/openpdf-cli",
    "crates/openpdf-gtk",
    "crates/openpdf-sign",
    "crates/openpdf-ocr-native",
]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
version = "0.1.0"
# Same as PR #6 / 1c120f2 (Flatpak rust-stable//26.08). Apply on rebase onto #6.
rust-version = "1.98.0"

[workspace.dependencies]
openpdf-core = { path = "crates/openpdf-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
